[project]
name = "webcam-eye-tracker"
version = "0.1.0"
description = "Continuously track eye movement from a webcam: iris overlay, gaze direction, blink detection and a live movement log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pynput>=1.8.2",
]

[project.scripts]
eye-tracker = "eye_tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eye_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
